# @package _global_

defaults:
  - /checkpoints/final/nancy_high@checkpoints.nancy_high
  - /checkpoints/final/nancy_low@checkpoints.nancy_low
  - /checkpoints/final/neutrophils@checkpoints.neutrophils
  - _self_

# Column split point in the classifier's 2*embed_dim-wide input - same
# convention/caveat as configs/explainability/theta_m_check.yaml.
embed_dim: 1280

# Per (n_components, scale_power) mlflow artifact URIs for nmf_fit's
# h.parquet - the fully recovered (scale multiplied back in) and
# gauge-fixed dictionary, already in original token units, so this script
# needs no shift/scale of its own (see explainability/sigma_table.py's
# module docstring). Keyed by n_components then scale_power, both as
# strings (OmegaConf nested-key quirk - see configs/explainability/
# concept_masks.yaml's h dict for the same convention one level shallower).
#
# The "1.0" entries are nmf_fit runs from before scale_power existed as a
# config knob at all (commit c3c7303 predates 251fc9a) - the code always
# applied plain IQR scaling then, exactly equivalent to scale_power=1.0, and
# these are the same run IDs already used for concept_masks.yaml's h dict.
h:
  "4":
