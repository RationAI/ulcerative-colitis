# @package _global_

defaults:
  - /checkpoints/final/nancy_high@checkpoints.nancy_high
  - /checkpoints/final/nancy_low@checkpoints.nancy_low
  - /checkpoints/final/neutrophils@checkpoints.neutrophils
  - _self_

# Column split point in the classifier's 2*embed_dim-wide input - same
# convention/caveat as configs/explainability/theta_z_check.yaml.
embed_dim: 1280

# Which grade's *tiles* to evaluate against - always an int 0-4 (there's no
# "all" CLS token partition to read; explainability.grade_split only ever
# writes grade=0..4). Drives cls_dir/m_features_path's population, same as
# before dict_grade existed. No default, one job per run, same convention as
# tile_r2_check.yaml.
grade: ???
n_components: ???
scale_power: ???

# Which nmf_fit.py (kind=cls) run's *dictionary* (w.f32.npy/h.parquet) to
# check - defaults to the same value as `grade` (the original convention: a
# grade-specific fit checked against its own grade's tiles), but can be
# overridden independently, e.g. dict_grade="all" to check the flat
# (no-grade-filter) fit against `grade`'s tile population instead - the
# direct flat-vs-grade-specific comparison from explainability-status
# memory's 2026-09-19 entry ("why grades were split"). Split out from `grade`
# specifically to make that comparison possible without conflating "which
# tiles" with "which dictionary".
dict_grade: ${grade}

# Local nmf_fit.py (kind=cls) output dir - holds w.f32.npy/w_metadata.parquet
# (project-mount only, too large for mlflow - same large-artifact treatment
# as everywhere else in this pipeline). Must match dict_grade/n_components/
# scale_power above; no separate mlflow fallback the way local_grade_split_dir
# has one, since nmf_fit.py never logs these to mlflow at all.
w_dir: ${project_dir}/explainability/nmf/cls/grade${dict_grade}/k${n_components}/scale_power_${scale_power}

h:
  # mlflow artifact URI for the specific nmf_fit.py (kind=cls) run's
  # h.parquet to check (must have been fit on grade=${grade},
  # n_components=${n_components}, scale_power=${scale_power}) - no default on
  # purpose, same convention as tile_r2_check.yaml's h.mlflow_uri.
  mlflow_uri: ???

# Same grade_split resolution as tile_r2_ols_check.yaml, duplicated rather
# than shared - only the CLS partition is read here (one row per tile, not
# the patch corpus), so this is cheap even though the config looks identical.
local_grade_split_dir: ${project_dir}/explainability/grade_split/${grade_split.split}
grade_split:
  split: train
  mlflow_uri: mlflow-artifacts:/86/97aa50e43e624920a44f29f0d624276f/artifacts/tokens

# Optional. Local kind=patch tile_r2_check.py run's tile_features.parquet,
# reused only for its `m` column (patch-side mean, shift-space) - the exact,
# never-approximated side of the m-only baseline / pathway-share check.
# Defaults to null (unset): m is being dropped from this line of work
# entirely (2026-09-19 decision, explainability-status memory - "everything
# through the bottleneck", z-only), and tile_r2_check_cls.py skips the whole
# m-pathway/full-target metric set when this is null, computing only the
# z-only metrics (r2_plugin_vs_z, r2_ols_vs_z, ols_gap_vs_z). Only set this
# if you specifically want those extra diagnostics AND a patch-side
# tile_r2_check.py run exists for the *same* grade as this run's `grade`
# above - m_features_path's population is grade-specific (so far only
# grade=4/k=12, 2026-09-04, 35,743 tiles, exists), and
# explainability.grade_split routes each tile into exactly one grade
# partition, so a grade mismatch here silently inner-joins to zero rows
# rather than erroring.
m_features_path: null

output_dir: ${project_dir}/explainability/tile_r2_check_cls/grade${grade}/dictgrade${dict_grade}/k${n_components}/scale_power_${scale_power}

metadata:
  run_name: "📏 Tile R^2 Check CLS (grade=${grade}, dict_grade=${dict_grade}, k=${n_components}, scale_power=${scale_power})"
  description: >-
    z_i analogue of tile_r2_check.py's plug-in R^2, plus tile_r2_ols_check.py's
    OLS gap and pathway-share analysis, roles swapped: R^2 of varphi @ sigma_z
    (concept-routed) vs. z @ Theta_z^T (direct), the OLS-fit gap on the same
    varphi, and how much of the full tile logit an m-only baseline (ignoring
    the z-concept pathway entirely) already explains. Reuses nmf_fit.py's
    already-saved per-tile varphi directly (kind=cls has exactly one CLS
    token per tile, so no patch streaming/pooling needed) and an existing
    kind=patch tile_r2_check.py run's `m` column (see m_features_path).
    dict_grade may differ from grade (e.g. dict_grade=all) to check one
    dictionary's fidelity against another grade's tile population.
  hyperparams:
    grade: ${grade}
    dict_grade: ${dict_grade}
    n_components: ${n_components}
    scale_power: ${scale_power}
