# @package _global_

defaults:
  - /dataset/embeddings/ftn@sources.ftn
  - /dataset/embeddings/ikem@sources.ikem
  - /checkpoints/final/nancy_high@checkpoints.nancy_high
  - /checkpoints/final/nancy_low@checkpoints.nancy_low
  - /checkpoints/final/neutrophils@checkpoints.neutrophils
  - _self_

local_embeddings_dir: ${project_dir}/embeddings

# Must be the split the dictionary (w_dir) was fit on - W only exists for those
# tiles. "train" is also what slides.parquet has ground-truth nancy_index for.
split: train

# Half the classifier's input width (h_i = [z_i; m_i]) - load_full_model
# checks classifier.weight against 2*embed_dim, and compute_readouts checks
# the embedding width against the classifier.
embed_dim: 1280

# Output dir of the nmf_fit.py or nmf_tree.py run to check (holds w.f32.npy,
# w_metadata.parquet, h.parquet, shift.npy) - no default, one job per fit.
# Must have been fit on `split` above.
w_dir: ???

# Tiles per streaming batch in the readout pass (~670MB of float64 at 2560 dims).
batch_size: 32768
# Tiles per chunk when rebuilding h_hat = shift + phi @ H for the recon surrogate.
chunk_size: 65536

# Next to the checked dictionary, so each result sits with the fit it scores.
output_dir: ${w_dir}/concept_surrogate_check

metadata:
  run_name: "🎯 Concept Surrogate Check (${split})"
  description: >-
    Tile-level R^2 and slide-level AUC of two concept surrogates of the real
    MIL model - the real model on the dictionary reconstruction shift + phi @ H,
    and an OLS readout of phi - against the real model's readout of the full
    tile embedding. Dictionary: ${w_dir}.
  hyperparams:
    split: ${split}
    w_dir: ${w_dir}
