# @package _global_

defaults:
  - /dataset/embeddings/ftn@sources.ftn
  - /dataset/embeddings/ikem@sources.ikem
  - /checkpoints/final/nancy_high@checkpoints.nancy_high
  - /checkpoints/final/nancy_low@checkpoints.nancy_low
  - /checkpoints/final/neutrophils@checkpoints.neutrophils
  - _self_

local_embeddings_dir: ${project_dir}/embeddings
split: train

# Half the classifier's input width - load_full_model checks classifier.weight
# against 2*embed_dim. The heads' weights give varsigma (tree priority and the
# min_gain test).
embed_dim: 1280

# "nmf" or "semi_nmf" - the factorization used for every split, same choice as
# nmf_fit.yaml's method. No default, pick per run.
method: ???
# Subtract the corpus mean embedding (the `mean` column of shift.mlflow_uri's
# percentile_stats.parquet - token_statistics runs before 2026-10-10 lack it)
# before factorizing; saved as shift.npy, added back by the decoder. semi_nmf only - without it, several of the K
# components get spent reproducing the mean every tile shares (k=12: 7 of 12
# components were such generic, class-inert ones). Must be false for nmf
# (centred data is ~half negative and NMF clips negatives to zero).
center: true
# Per-dimension scale = IQR ** scale_power, same as nmf_fit.yaml's
# nmf.scale_power. No default, pick per run.
scale_power: ???

shift:
  # token_statistics.py percentile_stats.parquet artifact URI over the
  # per-tile embeddings - IQR scale for both methods, shift for nmf only.
  # Same run as nmf_fit.yaml's shift.mlflow_uri - keep the two in sync.
  mlflow_uri: mlflow-artifacts:/86/205f4d2eac8d460a8541bf82f2087d52/artifacts/percentile_stats.parquet
  percentile_column: p0.0001

tree:
  # Fraction of slides read into memory to build the tree on, and of each
  # sampled slide's tiles - 0.3 of the tiles is ~400k, ~4GB float32 at 2560
  # dims either way. 1.0 / 0.3 (every slide, 30% of its tiles) makes the tree
  # far less seed-dependent; 0.3 / 1.0 reproduces trees fit before
  # 2026-10-30. Every tile is still transformed against the final leaves.
  sample_slide_fraction: 0.3
  sample_tile_fraction: 1.0
  # Safety cap with the default min_gain - a healthy run converges (every
  # leaf's split rejected) well before it; the manifest's `stopped_by` says
  # which happened. With min_gain=0 it is the target size instead: the tree
  # grows best-first to exactly this many leaves (unless stability or size
  # rejects every leaf first), and its first K leaves are the K-leaf tree.
  max_leaves: 128
  # A split is rejected if either child, or either stability half, would get
  # fewer sample rows than this.
  min_node_rows: 2000
  # Min cosine of the best-matched atom pair between the split re-fit on two
  # slide-disjoint halves of the node.
  stability_threshold: 0.9
  # Fit both stability halves starting from the node's own split instead of
  # the method's default init (k-means / nndsvda) - see nmf_tree.py's
  # docstring. false reproduces trees fit before 2026-10-29.
  stability_warm_start: true
  # Number of random slide-disjoint halvings the stability test (median
  # cosine) and the held-out gain (mean) are taken over. Each costs two more
  # rank-2 fits per node. 1 reproduces trees fit before 2026-10-30.
  stability_repeats: 1
  # Min held-out share of the model-relevant variation (the sample half's
  # total sum of squares of the per-tile head responses) a split must explain
  # to be accepted - the stopping rule in place of a leaf count. 0.005 = 0.5%.
  # tree.parquet logs every candidate's `gain` - calibrate from a first run
  # (and from the pathologist's "don't split" marks in the tree view).
  min_gain: 0.005
  # Which leaf to try next (see explainability/nmf_tree.py's docstring):
  # "variance" - the model-relevant variation inside the node,
  # (1/N) sum_i ||varsigma_i - mean varsigma||^2 over its tiles; "atom" - the
  # original mass * ||varsigma(atom)|| * err, kept for comparison (its
  # relevance cancels for nodes mixing tiles the model reads in opposite
  # directions).
  priority: variance
  # false: the unsupervised baseline tree - priority and gain ignore the
  # classifier (variance and gain: spread of the embeddings themselves; atom:
  # relevance = 1).
  supervised: true
  random_state: 42

factorization:
  # Maximum iterations of each rank-2 split fit (NMF max_iter / semi-NMF
  # alternations) - with tol set, fits stop as soon as they converge.
  n_iter: 100
  # FISTA iterations per NNLS solve (semi-NMF W-steps and the final transform;
  # a maximum inside split fits when tol is set, always run in full for the
  # final transform so W stays reproducible).
  nnls_iter: 200
  # Early-stopping tolerance of the split fits: relative change of H between
  # semi-NMF alternations (sklearn's own tol for nmf); null = always run
  # n_iter. Set from the logged final changes of the 2026-10-14 trees: at
  # 1e-4 199 of 199 fits ran to n_iter=100 still moving (median final change
  # 1.2e-3); 3e-3 is reached by 96-98% of fits, and moves an atom's
  # direction by cos ~ 1 - 5e-6. Each fit logs its iterations and final change.
  tol: 3.0e-3
  # Early-stopping tolerance of the inner NNLS solves (semi-NMF W-steps and
  # the held-out child assignment): relative change of W. Kept strict - child
  # assignment is an argmax of W. null = always run nnls_iter.
  nnls_tol: 1.0e-4

# Tiles read per streaming batch.
batch_size: 25600

output_dir: ${project_dir}/explainability/nmf_tree/embedding/${split}/${method}/center_${center}/scale_power_${scale_power}/priority_${tree.priority}/supervised_${tree.supervised}/min_gain_${tree.min_gain}/max_leaves_${tree.max_leaves}/tol_${factorization.tol}/stability_${tree.stability_threshold}/warm_start_${tree.stability_warm_start}/slides_${tree.sample_slide_fraction}/tiles_${tree.sample_tile_fraction}/repeats_${tree.stability_repeats}/seed_${tree.random_state}

metadata:
  run_name: "🌳 NMF Tree (${method}, center=${center}, ${split}, scale_power=${scale_power}, priority=${tree.priority}, supervised=${tree.supervised}, min_gain=${tree.min_gain}, max_leaves=${tree.max_leaves}, tol=${factorization.tol}, stability=${tree.stability_threshold}, warm_start=${tree.stability_warm_start}, slides=${tree.sample_slide_fraction}, tiles=${tree.sample_tile_fraction}, repeats=${tree.stability_repeats}, seed=${tree.random_state})"
  description: >-
    Recursive binary-split ${method} concept dictionary over the per-tile
    embeddings, grown best-first by tree.priority until every split fails the
    slide-disjoint stability or held-out min_gain test; every tile then
    NNLS-transformed against all leaves jointly.
  hyperparams:
    method: ${method}
    center: ${center}
    split: ${split}
    scale_power: ${scale_power}
    shift_mlflow_uri: ${shift.mlflow_uri}
    sample_slide_fraction: ${tree.sample_slide_fraction}
    sample_tile_fraction: ${tree.sample_tile_fraction}
    stability_repeats: ${tree.stability_repeats}
    max_leaves: ${tree.max_leaves}
    min_node_rows: ${tree.min_node_rows}
    stability_threshold: ${tree.stability_threshold}
    stability_warm_start: ${tree.stability_warm_start}
    min_gain: ${tree.min_gain}
    priority: ${tree.priority}
    supervised: ${tree.supervised}
    random_state: ${tree.random_state}
    n_iter: ${factorization.n_iter}
    nnls_iter: ${factorization.nnls_iter}
    tol: ${factorization.tol}
    nnls_tol: ${factorization.nnls_tol}
