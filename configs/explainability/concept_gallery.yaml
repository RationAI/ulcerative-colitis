# @package _global_

defaults:
  - /dataset/embeddings/ftn@sources.ftn
  - /dataset/embeddings/ikem@sources.ikem
  - /dataset/embeddings/knl_patos@sources.knl_patos
  - /checkpoints/final/nancy_high@checkpoints.nancy_high
  - /checkpoints/final/nancy_low@checkpoints.nancy_low
  - /checkpoints/final/neutrophils@checkpoints.neutrophils
  - _self_

local_embeddings_dir: ${project_dir}/embeddings

# Which tiles to evaluate - any split: every tile is encoded here with the
# (train-fit) dictionary. Same convention as concept_completeness.yaml, whose
# matching run (same split and institutions) feeds the Q1 panel.
split: train
# `+`-joined keys of `sources` - e.g. ftn+ikem, or knl_patos (no train split).
institutions: ftn+ikem

# Half the classifier's input width - load_full_model checks classifier.weight
# against 2*embed_dim.
embed_dim: 1280

# mlflow artifact root of the nmf_fit.py or nmf_tree.py run to show, e.g.
# "mlflow-artifacts:/86/<run_id>/artifacts" - set via
# configs/explainability/dictionary/<name>.yaml. Only small artifacts are read
# (h.parquet, manifest.json, shift.npy, tree.parquet).
dictionary_uri: ???

# Example tiles per concept (highest share of the tile's code, at most one per slide).
n_tiles: 8
# Only tiles whose total code reaches this quantile can be example tiles - a high
# share of a tiny code says nothing about the concept.
min_total_quantile: 0.5
# How many tiles fit across the xOpat viewer a clicked tile opens in, centred on it.
xopat_tiles_across: 4

# pathologist.html: size of the push, in SDs over slides of the concept's mean
# share. Large enough to read, small enough that adding and subtracting agree.
effect_step_sds: 0.25
# Concepts whose largest effect on a grade stays under this many percentage
# points are folded away at the end of pathologist.html.
minor_effect_points: 1.5

# xOpat concept masks. Concept rows to build them for, null for all (the slides
# of those rows get all K masks).
mask_concepts: null
# Masks are this many times smaller than the tiles' level: 9 is one pyramid level
# smaller than level 2, well under a tile stride.
mask_downsample: 9
# Quantiles of each concept's share over all tiles that fix its 8-bit scale.
mask_low_quantile: 0.5
mask_high_quantile: 0.999

# Tiles per streaming batch (each batch is encoded and decoded in memory).
batch_size: 32768
# FISTA iterations of the encoder E - same as the fit's own nnls_iter.
nnls_iter: 200

# null: next to the fit itself on the project mount -
# <fit dir>/concept_gallery/<split>/<institutions> (the fit dir comes from its manifest).
output_dir: null

metadata:
  run_name: "🖼️ Concept Gallery (${split}, ${institutions})"
  description: >-
    Q2/Q3 - example tiles per concept; per output class the exact slide
    attributions phi_kc = vbar_sk a_kc summarised as class separation (ground
    truth and predicted); per model attention enrichment and occlusion
    attributions with their additivity error; pathologist.html with each
    concept's effect on the final Nancy grade. Dictionary: ${dictionary_uri}.
  hyperparams:
    split: ${split}
    institutions: ${institutions}
    dictionary_uri: ${dictionary_uri}
    n_tiles: ${n_tiles}
    effect_step_sds: ${effect_step_sds}
