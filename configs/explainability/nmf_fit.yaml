# @package _global_

defaults:
  - /dataset/embeddings/ftn@sources.ftn
  - /dataset/embeddings/ikem@sources.ikem
  - _self_

# Preferred over mlflow's download_artifacts when present - same data on the
# same mount without the slow round-trip (see explainability.tiles.
# resolve_embedding_split_dirs).
local_embeddings_dir: ${project_dir}/embeddings

split: train

# "nmf" (W, H >= 0 on shifted/clipped embeddings, sklearn MiniBatchNMF) or
# "semi_nmf" (W >= 0, H signed, on the raw signed embeddings - no shift;
# explainability.nmf_fit.fit_semi_nmf_online). No default, pick per run.
method: ???

# Number of NMF components (concepts) - no default on purpose, pick one per run.
n_components: ???

shift:
  # Also needed for method=semi_nmf: the shift itself is unused there, but the
  # IQR scale comes from the same percentile_stats.parquet.
  #
  # mlflow artifact URI for a token_statistics.py run's
  # percentile_stats.parquet (small artifact - always fetched from mlflow,
  # see explainability.nmf_fit.resolve_percentile_stats_path). Must be a run
  # over the same per-tile embeddings this fit reads - stats from the old
  # embeddings_xai patch/cls tables have half the width and fail on
  # broadcasting. Update after every token_statistics.py run. Points at run
  # cd5ef7666f134c58abe108cd04cda9c2 (2026-10, split=train, 2560 dims).
  mlflow_uri: mlflow-artifacts:/86/cd5ef7666f134c58abe108cd04cda9c2/artifacts/percentile_stats.parquet
  # The 1e-4 quantile column (see explainability/token_statistics.py's column
  # naming): a light compromise between the true min (outlier-sensitive) and
  # a looser quantile (more clipping).
  percentile_column: p0.0001

nmf:
  # Tile embeddings read per partial_fit/transform call.
  batch_size: 25600
  # Each epoch re-reads the full raw corpus once - keep this bounded.
  epochs: 1
  # Row buffer for ray.data's local (per-worker, no cross-node shuffle) read
  # order randomization during training - see iter_embedding_batches'
  # shuffle_seed. Bigger mixes more tiles per partial_fit call at the cost of
  # more RAM - and of pyarrow offset-overflow risk, so this can't just be
  # raised freely.
  #
  # Hard ceiling, not just a memory tradeoff: Ray's local shuffle
  # concatenates the whole buffered `embedding` column into one contiguous
  # pyarrow ListArray, whose default int32 offsets cap the flattened child
  # array at 2^31-1 (~2.15B) elements - confirmed to overflow in practice
  # (`pyarrow.lib.ArrowInvalid: offset overflow while concatenating arrays`)
  # at 1.64B elements on the old 1280-dim tables. At 2560 dims (float64,
  # ~20KB/tile), 250_000 rows is 640M elements (~30% of the ceiling, safe
  # margin for the batcher's overshoot) and ~5GB of buffer.
  shuffle_buffer_size: 250_000
  # method=nmf only (MiniBatchNMF).
  init: random
  beta_loss: frobenius
  # FISTA iterations per batch for every NNLS solve of W given H - the final
  # transform pass (both methods) and semi-NMF's per-batch W-step.
  nnls_iter: 200
  random_state: 42
  gauge_fix: true
  # Per-dimension scale = IQR ** scale_power, before dividing embeddings by it
  # (and multiplying H back out by it afterward - explainability/nmf_fit.py
  # applies this consistently in both places, so this one knob controls the
  # whole scheme). 1.0 = original IQR scaling; 0.5 = sqrt(IQR), a gentler
  # version that still reins in the most extreme dims without flattening
  # them to parity with everything else; 0.0 = no scaling at all (IQR**0=1
  # for every dimension, exactly - not an approximation). Worth sweeping
  # because |Theta|*IQR (each dimension's actual contribution to the trained
  # classifiers' logits) turned out *positively* correlated with IQR, so
  # plain IQR scaling may be suppressing exactly the dimensions that matter
  # most.
  scale_power: 1.0

# method=semi_nmf only - online H-step from forgotten sufficient statistics
# (see explainability.nmf_fit.fit_semi_nmf_online).
semi_nmf:
  # Per-batch decay of the accumulated W^T W / W^T X statistics; < 1
  # down-weights batches seen with an early, worse H.
  forget: 0.95
  # Ridge added to W^T W before solving for H (numerical safety only).
  ridge: 1.0e-6

output_dir: ${project_dir}/explainability/nmf/embedding/${split}/${method}/k${n_components}/scale_power_${nmf.scale_power}

metadata:
  run_name: "🧩 NMF Fit (${method}, ${split}, k=${n_components}, scale_power=${nmf.scale_power})"
  description: >-
    Flat ${method} dictionary over the (scale_power-scaled) full per-tile
    embeddings h_i, gauge-fixed W/H stored for downstream explainability.
  hyperparams:
    method: ${method}
    split: ${split}
    n_components: ${n_components}
    shift_mlflow_uri: ${shift.mlflow_uri}
    percentile_column: ${shift.percentile_column}
    scale_power: ${nmf.scale_power}
    batch_size: ${nmf.batch_size}
    epochs: ${nmf.epochs}
    shuffle_buffer_size: ${nmf.shuffle_buffer_size}
    random_state: ${nmf.random_state}
    gauge_fix: ${nmf.gauge_fix}
