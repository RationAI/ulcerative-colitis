# @package _global_

defaults:
  - /dataset/embeddings_xai/ftn@sources.ftn
  - /dataset/embeddings_xai/ikem@sources.ikem
  - _self_

local_embeddings_xai_dir: ${project_dir}/embeddings_xai

# Number of NMF components (concepts) - no default on purpose, pick one per run.
n_components: ???

shift:
  # mlflow artifact URI for a specific patch_statistics run's
  # percentile_stats.parquet (small artifact - always fetched from mlflow,
  # not a local mount, unlike the patch/cls token parquet or W/H memmaps -
  # see explainability.nmf_fit.resolve_percentile_stats_path). No default on
  # purpose: mirrors configs/dataset/embeddings_xai/{ftn,ikem}.yaml's
  # mlflow_uris convention - update after every patch_statistics.py run,
  # e.g. "mlflow-artifacts:/86/<run_id>/artifacts/percentile_stats.parquet".
  # Must point at a run whose percentiles include p0.25/p0.75 (load_scale's
  # IQR columns) - older, pre-IQR runs won't have them.
  mlflow_uri: mlflow-artifacts:/86/45bdcedf6f0c4f9fa39d43d1a8cbe020/artifacts/percentile_stats.parquet
  # The 1e-4 quantile column (see explainability/patch_statistics.py's column
  # naming): a light compromise between the true min (outlier-sensitive) and
  # a looser quantile (more clipping). Retune once the real table is inspected.
  percentile_column: p0.0001

nmf:
  # Patches read per partial_fit/transform call.
  batch_size: 25600
  # Each epoch re-reads the full raw corpus once - keep this bounded.
  epochs: 1
  # Row buffer for ray.data's local (per-worker, no cross-node shuffle) read
  # order randomization during training - see iter_patch_batches' shuffle_seed.
  # Bigger mixes more patches per partial_fit call at the cost of more RAM
  # (~5KB/patch at 1280 float32 -> 1.28M patches ~= 6.5GB in the buffer).
  shuffle_buffer_size: 1_280_000
  init: random
  beta_loss: frobenius
  random_state: 42
  gauge_fix: true

output_dir: ${project_dir}/explainability/nmf/k${n_components}

metadata:
  run_name: "🧩 NMF Fit (k=${n_components})"
  description: >-
    MiniBatchNMF over shifted patch tokens (ftn + ikem full corpus),
    gauge-fixed W/H stored for downstream explainability.
  hyperparams:
    n_components: ${n_components}
    percentile_column: ${shift.percentile_column}
    batch_size: ${nmf.batch_size}
    epochs: ${nmf.epochs}
    shuffle_buffer_size: ${nmf.shuffle_buffer_size}
    random_state: ${nmf.random_state}
    gauge_fix: ${nmf.gauge_fix}
