[project]
name = "ulcerative-colitis"
version = "0.1.0"
authors = [{name = "Adam Kukučka", email = "adam.kukucka@mail.muni.cz"}]
requires-python = ">=3.12,<3.13"
readme = "README.md"
license = { file = "LICENSE" }
dependencies = [
    "aiohttp>=3.13.2",
    "lightning>=2.5.6",
    "mlflow>=3.16.1",
    "omegaconf>=2.3.0",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "pyvips>=3.0.0,<3.1",
    "rationai-sdk>=0.1.0",
    "rationai-mlkit>=0.4.1",
    "rationai-masks>=1.1.1",
    "rationai-tiling>=1.1.1",
    "ray[data]>=2.52.1",
    "scikit-learn>=1.8.0",
    "torch>=2.9.0",
    "torchmetrics>=1.8.2",
    "ratiopath>=1.1.2",
    "rich>=15.0.0",
]

[dependency-groups]
dev = ["mypy>=1.19.1", "ruff>=0.14.14", "ipykernel>=7.1.0"]
job = ["rationai-kube-jobs>=0.4.0"]

[tool.uv.sources]
rationai-mlkit = { git = "https://github.com/RationAI/mlkit.git" }
rationai-masks = { git = "https://gitlab.ics.muni.cz/rationai/digital-pathology/libraries/masks.git" }
rationai-tiling = { git = "https://gitlab.ics.muni.cz/rationai/digital-pathology/libraries/tiling.git" }
rationai-kube-jobs = { git = "ssh://git@gitlab.ics.muni.cz/rationai/infrastructure/kube-jobs" }
rationai-sdk = { git = "https://github.com/RationAI/rationai-sdk-python.git" }
